<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント削除リクエスト</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        h2 { text-align: center; }
        label { font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: red; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background-color: darkred; }
    </style>
</head>
<body>
    <h2>アカウント削除リクエスト</h2>
    <p>以下のフォームに必要事項を入力し、送信してください。</p>

    <form action="https://docs.google.com/forms/d/e/your_google_form_id/formResponse" method="POST">
        <label for="email">登録メールアドレス:</label>
        <input type="email" id="email" name="entry.123456789" required>

        <label for="user-id">アカウントID:</label>
        <input type="text" id="user-id" name="entry.987654321" required>

        <label for="reason">削除理由 (任意):</label>
        <textarea id="reason" name="entry.567890123" rows="4"></textarea>

        <button type="submit">アカウント削除をリクエスト</button>
    </form>
</body>
</html>
